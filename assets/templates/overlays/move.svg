<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Legal move target: a soft dot in the middle of an empty square.
       The colour slot is filled with white by scripts/generate_assets.py, and the app tints it -->
  <defs>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="{{color}}" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="{{color}}" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="{{color}}" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- A faint shadow so the dot shows on light and dark squares alike -->
  <circle cx="51" cy="52" r="15" fill="#000" opacity="0.30" filter="url(#shadow)"/>
  <circle cx="50" cy="50" r="15" fill="url(#dot)"/>
</svg>
