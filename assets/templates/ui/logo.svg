      <circle cx="-17" cy="-7.8" r="1.9"/>
      <circle cx="-7.5" cy="-11" r="1.9"/>
      <circle cx="0" cy="-14.2" r="2.1"/>
      <circle cx="7.5" cy="-11" r="1.9"/>
      <circle cx="17" cy="-7.8" r="1.9"/>
    </g>

