<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160">
  <!-- The main menu's wordmark: a gold crown beside "Checkers", with a thin gold rule under it.
       The letters take the theme's text colour, so there's one version for dark mode and one
       for light; colour slots in double braces come from scripts/generate_assets.py.
       The letters are outlines of Noto Serif Display Bold (SIL Open Font License), since the
       app's renderer draws no text -->
