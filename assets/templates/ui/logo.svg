  <!-- Soft shadows lift the crown and the word off the background -->
  <g fill="#000" opacity="{{shadow}}" filter="url(#shadow)">
    <use href="#crown" transform="translate(85 73) scale(2.6)"/>
    <use href="#word" transform="translate(167 101)"/>
  </g>

  <!-- Crown: gold with a darker edge so it stays crisp when small -->
  <g transform="translate(84 70) scale(2.6)">
    <use href="#crown" fill="url(#gold)" stroke="{{gold_dark}}" stroke-width="0.6" stroke-linejoin="round"/>
    <!-- The band is a shade darker than the points -->
    <path d="M-13.5 6.8 H13.5 L13 10 Q0 12 -13 10 Z" fill="{{gold_dark}}" opacity="0.45"/>
  </g>

  <use href="#word" transform="translate(166 99)" fill="{{text}}"/>

  <!-- A thin gold rule under the word, broken by a small checkered diamond -->
  <g transform="translate(373.5 126)">
    <path d="M-206 0 H-15 M15 0 H206" stroke="{{gold}}" stroke-width="2.5" stroke-linecap="round"/>
    <g transform="rotate(45)">
      <rect x="-8" y="-8" width="16" height="16" rx="1" fill="{{gold_dark}}"/>
      <rect x="-6.5" y="-6.5" width="6.5" height="6.5" fill="{{gold_light}}"/>
      <rect x="0" y="0" width="6.5" height="6.5" fill="{{gold_light}}"/>
    </g>
  </g>
</svg>
